# ==============================================================================
# CITARASA CATERING - KONFIGURASI NGINX REVERSE PROXY PRODUKSI
# ==============================================================================
# Lokasi file di server: /etc/nginx/sites-available/citarasa.conf
# Simpan tautan simbolik ke: /etc/nginx/sites-enabled/citarasa.conf
# Uji konfigurasi dengan: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# Rate Limiting Zones (Mencegah Brute Force dan DoS)
limit_req_zone $binary_remote_addr zone=citarasa_umum:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=citarasa_auth:10m rate=5r/m;

# 1. Redirect Semua HTTP Port 80 ke HTTPS Port 443
server {
    listen 80;
    listen [::]:80;
    server_name citarasacatering.com www.citarasacatering.com;

    # Lokasi verifikasi Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Blok Server Utama HTTPS Port 443
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name citarasacatering.com www.citarasacatering.com;

    # Sertifikat SSL (Dikelola otomatis oleh Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/citarasacatering.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citarasacatering.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Header Keamanan Produksi
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Ukuran Maksimal Kiriman Klien (Mendukung Unggah Foto Bukti & Menu s.d. 10MB)
    client_max_body_size 10M;

    # Kompresi Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # Log Akses dan Error
    access_log /var/log/nginx/citarasa_access.log;
    error_log /var/log/nginx/citarasa_error.log warn;

    # Cache Aset Statis Next.js (Immutable 1 Tahun)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Berkas Unggahan (foto menu & bukti transfer)
    #
    # Dilayani oleh route Next.js yang memeriksa wewenang, bukan oleh berkas
    # statis. Karena itu Cache-Control sengaja TIDAK ditimpa di sini: aplikasi
    # menandai foto menu boleh disimpan lama, sedangkan bukti transfer
    # `private, no-store`. Menimpanya dengan "public" di lapisan ini akan
    # membuat bukti transfer milik satu pembeli tersimpan di cache bersama.
    location /unggahan/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Pembatasan Laju Khusus Halaman Masuk, Daftar, dan Lacak
    location ~* ^/(masuk|daftar|lacak) {
        limit_req zone=citarasa_auth burst=10 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Proksi Utama ke Server Next.js
    location / {
        limit_req zone=citarasa_umum burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

