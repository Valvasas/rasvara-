name: CI - Citarasa Catering

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Typecheck, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Samakan dengan Dockerfile (node:24-alpine). CI yang memakai versi
          # Node berbeda dari produksi bisa lulus untuk kode yang justru gagal
          # di server.
          node-version: 24
          cache: "npm"
          cache-dependency-path: "Citarasa_Catering/package-lock.json"

      - name: Install dependencies
        working-directory: "Citarasa_Catering"
        run: npm ci

      - name: Generate Prisma Client
        working-directory: "Citarasa_Catering"
        run: npm run db:generate

      - name: Check TypeScript types
        working-directory: "Citarasa_Catering"
        run: npm run typecheck

      - name: Lint
        working-directory: "Citarasa_Catering"
        run: npm run lint

      - name: Run unit tests
        working-directory: "Citarasa_Catering"
        run: npm test

      - name: Build Next.js application
        working-directory: "Citarasa_Catering"
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/citarasa?schema=public"
          SESSION_SECRET: "ci-dummy-session-secret-for-build-step-minimal-32-chars"
        run: npm run build

