type BusinessInfo @table {
  name: String!
  phone: String!
  email: String!
  address: String!
  description: String
  website: String
  socialMediaLinks: [String]
}

type MenuItem @table {
  name: String!
  description: String!
  price: Float!
  category: String!
  dietaryRestrictions: [String]
  menu: Menu # Singular reference field for one-to-many relationship with Menu
}

type Menu @table {
  name: String!
  description: String!
  minimumGuests: Int
  pricePerPerson: Float
}

type CateringInquiry @table {
  clientName: String!
  clientEmail: String!
  eventDate: Date!
  eventType: String!
  guestCount: Int!
  createdAt: Timestamp!
  clientPhone: String
  eventLocation: String
  specialRequests: String
  status: String
  menu: Menu
}

type Testimonial @table {
  clientName: String!
  reviewText: String!
  createdAt: Timestamp!
  eventType: String
  eventDate: Date
}