services:
  postgres:
    image: postgres:16-alpine
    container_name: annie-catering-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: annie_catering
    ports:
      - "5432:5432"
    volumes:
      - annie_catering_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d annie_catering"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  annie_catering_pgdata:
